<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Modération du mur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Gochi+Hand&display=swap">
<style>
/* Même univers que la carte de l'équipe, en plus sobre. */
:root{
  --email:#1F3BFF; --email-deep:#1426B8;
  --rose:#FF5FA2; --citron:#FFD23F; --menthe:#4FE3B0; --mandarine:#FF7A2F;
  --argile:#FFF4EC; --encre:#140A3D; --voile:rgba(255,244,236,.18);
  --display:"Bagel Fat One","Arial Black",system-ui,sans-serif;
  --body:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --main:"Gochi Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip}
[hidden]{display:none!important}
body{margin:0;background:var(--email);color:var(--argile);font-family:var(--body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(36px,6vw,72px)}
.cadre{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,4vw,44px)}
.etiquette{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;margin:0}
h1{font-family:var(--display);font-weight:400;line-height:.95;margin:0;text-wrap:balance;font-size:clamp(2.4rem,1.6rem + 4vw,4.6rem)}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
:focus-visible{outline:4px solid var(--citron);outline-offset:3px;border-radius:6px}
.boite{width:min(100%,560px);background:var(--argile);color:var(--encre);border-radius:28px;padding:clamp(22px,4vw,34px);display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 0 var(--email-deep);text-align:center}
.boite p{margin:0;font-weight:600}
.code{font:700 .9rem ui-monospace,monospace;background:#fff;border:2px solid var(--encre);border-radius:10px;padding:.4em .7em;overflow-wrap:anywhere;user-select:all}
.bouton{font:800 1.05rem/1 var(--body);border:0;cursor:pointer;color:var(--encre);background:var(--citron);padding:1em 1.6em;border-radius:999px;box-shadow:0 6px 0 var(--encre)}
.bouton:active{transform:translateY(4px);box-shadow:0 2px 0 var(--encre)}
.lien{background:none;border:0;color:inherit;font:600 .9rem var(--body);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.statut{min-height:1.4em;text-align:center;font-weight:700;margin:0}
.postits{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:24px}
.postit{flex:0 1 240px;min-width:0;color:var(--encre);padding:20px 20px 16px;min-height:180px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(20,10,61,.28)}
.postit p{margin:0;font-family:var(--main);font-size:1.4rem;line-height:1.18;overflow-wrap:anywhere;white-space:pre-line}
.postit .qui{margin-top:auto;font-weight:800;overflow-wrap:anywhere}
.postit .retirer{align-self:flex-start;background:none;border:2px solid var(--encre);color:var(--encre);font:700 .78rem var(--body);border-radius:999px;padding:.25em .8em;cursor:pointer}
.vide{text-align:center;font-family:var(--main);font-size:1.5rem;margin:0}
.postit img{width:100%;aspect-ratio:4/3;object-fit:cover;border:6px solid #fff}
.ligne{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.boite h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,1.3rem + 1.4vw,2.2rem);line-height:1;margin:0}
.dates{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dates li{background:#fff;border:2px solid var(--encre);border-radius:999px;padding:.3em .8em;font-weight:700;font-size:.9rem}
.ajout{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:center;width:100%}
.ajout .champ{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.ajout label{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.ajout input,.ajout select{font:600 1rem var(--body);color:var(--encre);background:#fff;border:3px solid var(--encre);border-radius:12px;padding:.55em .7em;width:100%}
</style>
</head>
<body>
<div class="cadre">
  <header>
    <p class="etiquette">Modération</p>
    <h1>Le mur de Lucie</h1>
  </header>

  <div class="boite" id="entree">
    <p>Connecte toi avec le compte Google autorisé pour retirer des mots.</p>
    <button class="bouton" type="button" id="connecter">Me connecter avec Google</button>
  </div>

  <div class="boite" id="refus" hidden>
    <p>Ce compte n'est pas encore admin. Voici ton identifiant : crée le document admins/cet identifiant dans Firestore (le README explique comment), puis recharge la page.</p>
    <span class="code" id="uid"></span>
    <button class="bouton" type="button" id="copier">Copier mon identifiant</button>
    <button class="lien" type="button" data-sortir>Me déconnecter</button>
  </div>

  <p class="statut" id="statut" role="status" aria-live="polite"></p>

  <section class="boite" id="creneaux" hidden aria-labelledby="tCreneaux">
    <h2 id="tCreneaux">Les dates du sondage</h2>
    <ul class="dates" id="dates"></ul>
    <button class="bouton" type="button" id="depart" hidden>Ajouter les créneaux de départ</button>
    <form class="ajout" id="ajout" novalidate>
      <div class="champ">
        <label for="nvDate">Proposer une autre date</label>
        <input type="date" id="nvDate">
      </div>
      <div class="champ">
        <label for="nvHeure">Moment</label>
        <select id="nvHeure"><option>En soirée</option><option>Le midi</option><option>L'après midi</option><option>Le matin</option></select>
      </div>
      <button class="bouton" type="submit">Ajouter</button>
    </form>
  </section>

  <p class="etiquette" id="nbMots" aria-live="polite"></p>
  <div class="postits" id="postits" hidden></div>
  <button class="lien" type="button" id="sortir" data-sortir hidden>Me déconnecter</button>
</div>

<script type="module">
import { espaceAdmin, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, doc, collection, onSnapshot, getDoc, deleteDoc, writeBatch } from "../js/base.js";
const $ = s => document.querySelector(s);
const { auth, db } = espaceAdmin();
const fonds = {citron:"var(--citron)", rose:"var(--rose)", menthe:"var(--menthe)", mandarine:"var(--mandarine)", argile:"#fff"};
let arrets = [], creneaux = [];
// Les créneaux proposés au départ dans le sondage de dates.
const DEPART = [["2026-10-29","En soirée"],["2026-10-31","L'après midi"],["2026-11-03","En soirée"],["2026-11-05","En soirée"],
                ["2026-11-07","L'après midi"],["2026-11-12","En soirée"],["2026-11-14","L'après midi"]];
const ident = (date,moment) => (date+"-"+moment).normalize("NFD").replace(/[^\w-]/g,"").toLowerCase();
const jours = new Intl.DateTimeFormat("fr-FR",{weekday:"long", day:"numeric", month:"long"});

function rendreCreneaux(){
  const ul = $("#dates"); ul.textContent = "";
  for (const c of [...creneaux].sort((a,b) => a.id.localeCompare(b.id))) {
    const li = document.createElement("li");
    li.textContent = jours.format(new Date(c.date+"T12:00")) + ", " + (c.moment||"").toLowerCase();
    ul.appendChild(li);
  }
  if (!creneaux.length) { const li = document.createElement("li"); li.textContent = "Aucune date pour l'instant"; ul.appendChild(li); }
  $("#depart").hidden = DEPART.every(([d,m]) => creneaux.some(c => c.id === ident(d,m)));
}

// Un créneau ne se modifie plus une fois créé, donc on n'écrit que ceux qui manquent.
async function ajouterCreneaux(liste){
  const manque = liste.filter(([d,m]) => !creneaux.some(c => c.id === ident(d,m)));
  if (!manque.length) return 0;
  const lot = writeBatch(db);
  for (const [date,moment] of manque) lot.set(doc(db, "creneaux", ident(date,moment)), {date, moment});
  await lot.commit();
  return manque.length;
}

$("#depart").addEventListener("click", async () => {
  const b = $("#depart"); b.disabled = true;
  try { const n = await ajouterCreneaux(DEPART); $("#statut").textContent = n + (n>1 ? " créneaux ajoutés au sondage." : " créneau ajouté au sondage."); }
  catch(err) { $("#statut").textContent = "Les créneaux n'ont pas pu être ajoutés. Vérifie ta connexion, puis réessaie."; }
  finally { b.disabled = false; }
});

$("#ajout").addEventListener("submit", async e => {
  e.preventDefault();
  const date = $("#nvDate").value, moment = $("#nvHeure").value;
  if (!date) { $("#statut").textContent = "Choisis une date à proposer."; $("#nvDate").focus(); return; }
  try {
    const n = await ajouterCreneaux([[date, moment]]);
    $("#statut").textContent = n ? "Date ajoutée, tout le monde peut la cocher." : "Cette date est déjà dans le sondage.";
    if (n) $("#nvDate").value = "";
  } catch(err) { $("#statut").textContent = "La date n'a pas pu être ajoutée, réessaie."; }
});

$("#copier").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#uid").textContent); $("#copier").textContent = "Identifiant copié"; }
  catch(e) { getSelection().selectAllChildren($("#uid")); $("#statut").textContent = "La copie n'a pas marché, l'identifiant est sélectionné : fais Cmd C."; }
  setTimeout(() => { $("#copier").textContent = "Copier mon identifiant"; }, 2500);
});

function rendre(docs){
  const zone = $("#postits"); zone.textContent = "";
  const liste = docs.map(d => ({id:d.id, ...d.data({serverTimestamps:"estimate"})}))
    .sort((a,b) => (a.date ? a.date.toMillis() : 0) - (b.date ? b.date.toMillis() : 0));
  $("#nbMots").textContent = liste.length ? (liste.length === 1 ? "1 mot sur le mur" : liste.length + " mots sur le mur") : "";
  if (!liste.length) { const v=document.createElement("p"); v.className="vide"; v.textContent="Aucun mot pour l'instant."; zone.appendChild(v); return; }
  for (const m of liste) {
    const el = document.createElement("article"); el.className = "postit";
    el.style.background = fonds[m.couleur] || fonds.citron;
    const p = document.createElement("p"); p.textContent = m.texte || "";
    if (typeof m.photo === "string" && m.photo.startsWith("data:image/jpeg;base64,")) {
      const im = document.createElement("img"); im.src = m.photo; im.alt = "Photo de " + (m.prenom || "l'équipe"); im.loading = "lazy"; el.appendChild(im);
    }
    const r = document.createElement("button"); r.type="button"; r.className="retirer"; r.textContent="Retirer ce mot";
    r.addEventListener("click", async () => {
      if (!confirm(`Retirer le mot de ${m.prenom || "cette personne"} ? Il disparaîtra aussi du site de Lucie.`)) return;
      r.disabled = true;
      try { await deleteDoc(doc(db, "mots", m.id)); $("#statut").textContent = "Le mot a été retiré du mur."; }
      catch(e) { r.disabled = false; $("#statut").textContent = "Le mot n'a pas pu être retiré. Vérifie ta connexion, puis réessaie."; }
    });
    const q = document.createElement("span"); q.className="qui"; q.textContent = m.prenom || "";
    el.append(p, r, q); zone.appendChild(el);
  }
}

$("#connecter").addEventListener("click", async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e) { $("#statut").textContent = "La connexion n'a pas abouti. Autorise les fenêtres pop up pour ce site, puis réessaie."; }
});
for (const b of document.querySelectorAll("[data-sortir]")) b.addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async u => {
  for (const a of arrets) a(); arrets = [];
  $("#statut").textContent = "";
  $("#entree").hidden = !!u; $("#refus").hidden = true; $("#postits").hidden = true; $("#sortir").hidden = true; $("#creneaux").hidden = true;
  if (!u) return;
  let admin = false;
  try { admin = (await getDoc(doc(db, "admins", u.uid))).exists(); }
  catch(e) { $("#statut").textContent = "La vérification du compte a échoué. Recharge la page."; return; }
  if (!admin) { $("#uid").textContent = u.uid; $("#refus").hidden = false; return; }
  $("#postits").hidden = false; $("#sortir").hidden = false; $("#creneaux").hidden = false;
  const coupure = () => { $("#statut").textContent = "La liste ne se met plus à jour. Recharge la page."; };
  arrets.push(onSnapshot(collection(db, "mots"), s => rendre(s.docs), coupure));
  arrets.push(onSnapshot(collection(db, "creneaux"), s => { creneaux = s.docs.map(d => ({id:d.id, ...d.data()})); rendreCreneaux(); }, coupure));
});
</script>
</body>
</html>
